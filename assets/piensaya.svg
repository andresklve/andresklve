    <circle cx="42" cy="386" r="4" fill="#5ee1ff"/><text x="54" y="390">WebSocket (Socket.IO)</text>
    <circle cx="42" cy="408" r="4" fill="#ff6b5e"/><text x="54" y="412">events → RabbitMQ → Redis feed</text>
  </g>

