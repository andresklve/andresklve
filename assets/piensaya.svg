<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" fill="none">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dash { stroke-dasharray: 4 8; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ffffff" fill-opacity=".07"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="998" height="438" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="440" fill="#07080a"/>
    <rect width="1000" height="440" fill="url(#dots)"/>
  </g>
  <rect x="1" y="1" width="998" height="438" rx="16" stroke="#ffffff" stroke-opacity=".14"/>

  <text x="36" y="48" class="mono" font-size="12" fill="#c4f542">★ featured</text>
  <text x="36" y="86" class="sans" font-size="34" font-weight="700" letter-spacing="-1" fill="#e9ecef">PiensaYa</text>
  <text x="36" y="112" class="mono" font-size="13" fill="#5ee1ff">5 microservices · event-driven</text>

  <g class="mono" font-size="11" fill="#8a9099">
