<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" fill="none">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    .rise { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }
    .type { clip-path: inset(0 100% 0 0); animation: type .9s steps(9) forwards; }
    .caret { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 5s cubic-bezier(.6,0,.4,1) infinite; }
    .pulse { transform-origin: 46px 271px; animation: pulse 1.8s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .fade, .rise, .type, .caret, .scan, .pulse { animation: none; opacity: 1; transform: none; clip-path: none; }
    }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-80px); } 100% { transform: translateY(340px); } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
  </style>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#c4f542" stop-opacity=".14"/>
      <stop offset="1" stop-color="#c4f542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4f542" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c4f542" stop-opacity=".06"/>
      <stop offset="1" stop-color="#c4f542" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="998" height="318" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1000" height="320" fill="#07080a"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#glow)"/>
    <rect class="scan" y="0" width="1000" height="80" fill="url(#scanline)"/>
  </g>
  <rect x="1" y="1" width="998" height="318" rx="16" stroke="#ffffff" stroke-opacity=".14"/>

  <!-- barra de la ventana -->
  <path d="M1 44H999" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="28" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6" fill="#febc2e"/>
  <circle cx="68" cy="23" r="6" fill="#28c840"/>
  <text x="500" y="27" text-anchor="middle" class="mono" font-size="12" fill="#565c66">zsh — carlos@lima</text>

  <!-- prompt -->
  <g class="mono" font-size="16">
    <text x="40" y="86"><tspan fill="#c4f542">carlos@lima</tspan><tspan fill="#565c66">:</tspan><tspan fill="#5ee1ff">~</tspan><tspan fill="#565c66">$ </tspan></text>
    <text x="190" y="86" fill="#e9ecef" class="type">whoami</text>
  </g>

  <!-- nombre -->
  <text x="38" y="150" class="sans rise" style="animation-delay:1s" font-size="48" font-weight="700" letter-spacing="-1.4"><tspan fill="#e9ecef">Carlos Andres </tspan><tspan fill="none" stroke="#e9ecef" stroke-opacity=".6" stroke-width="1.1">Infantas Galindo</tspan></text>

  <!-- rol -->
  <text x="40" y="196" class="mono fade" style="animation-delay:1.7s" font-size="18" fill="#c4f542"><tspan fill="#565c66">&gt; </tspan>Backend Developer · Software Architecture</text>

  <!-- checks -->
  <g class="mono" font-size="13">
    <text x="40" y="236" class="fade" style="animation-delay:2.2s"><tspan fill="#565c66">[</tspan><tspan fill="#c4f542"> OK </tspan><tspan fill="#565c66">]</tspan><tspan fill="#8a9099"> java.spring.boot loaded</tspan></text>
    <text x="300" y="236" class="fade" style="animation-delay:2.45s"><tspan fill="#565c66">[</tspan><tspan fill="#c4f542"> OK </tspan><tspan fill="#565c66">]</tspan><tspan fill="#8a9099"> typescript.nestjs loaded</tspan></text>
    <text x="530" y="236" class="fade" style="animation-delay:2.7s"><tspan fill="#565c66">[</tspan><tspan fill="#c4f542"> OK </tspan><tspan fill="#565c66">]</tspan><tspan fill="#8a9099"> amqp://rabbitmq connected</tspan></text>
  </g>

  <!-- estado -->
  <g class="fade" style="animation-delay:3.1s">
    <circle class="pulse" cx="46" cy="271" r="4" fill="#c4f542"/>
    <circle cx="46" cy="271" r="4" fill="#c4f542"/>
    <text x="40" y="276" class="mono" font-size="13" fill="#8a9099"><tspan x="60">Lima, Perú · UTC−5</tspan></text>
    <text x="760" y="276" class="mono" font-size="13" fill="#565c66">❯ ready</text>
    <rect class="caret" x="822" y="264" width="8" height="15" fill="#c4f542"/>
  </g>
</svg>
